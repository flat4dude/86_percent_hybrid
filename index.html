<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated 86% Kalshi Gold Scalper</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161920;
            --text-color: #ffffff;
            --text-muted: #8a94a6;
            --accent-red: #ff4a5a;
            --accent-green: #00e676;
            --border-color: #262b36;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 16px; display: flex; justify-content: center;
        }
        .container {
            width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 24px;
            padding: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;
        }
        .title { font-size: 18px; font-weight: 700; color: #ffd700; }
        .signal-btn {
            background-color: #2d3748; color: var(--text-muted);
            text-align: center; padding: 16px; border-radius: 16px;
            font-size: 20px; font-weight: 800; margin-bottom: 20px;
        }
        .signal-buydown { background-color: var(--accent-red); color: white; animation: pulse 1.5s infinite; }
        .signal-buyup { background-color: var(--accent-green); color: #0d0e12; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); }
        }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        
        .control-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        input {
            background-color: transparent; border: none;
            color: white; padding: 12px 6px; font-size: 16px; font-weight: 600;
            width: 100%; text-align: center; outline: none;
        }
        .adjust-btn {
            background: #262b36; border: none; color: white;
            font-size: 18px; font-weight: bold; width: 40px; height: 44px;
            cursor: pointer;
        }
        .strategy-banner {
            background: rgba(0, 230, 118, 0.05); border: 1px dashed var(--accent-green);
            padding: 12px; border-radius: 12px; font-size: 12px; text-align: center;
            color: var(--accent-green); margin-bottom: 16px; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">🏆 KXGOLD15M 86% Auto</div>
        <div style="font-size: 12px; color: #ffd700;" id="sync-indicator">● Hybrid Active</div>
    </div>

    <!-- HIGH CONVICTION SIGNAL BAR -->
    <div id="signal-display" class="signal-btn">WAITING FOR WINDOW</div>

    <div class="strategy-banner">
        🔥 SYSTEM AUTOMATED: Alert opens at 5:00 left if Premium hits 86%+
    </div>

    <!-- FAST ADJUSTMENT DATA FIELDS -->
    <div class="input-group">
        <div class="field">
            <label>✍️ Spot Price ($)</label>
            <div class="control-wrapper">
                <button class="adjust-btn" onclick="adjustValue('spot-price', -1)">-</button>
                <input type="number" id="spot-price" value="4362.57" step="0.01" oninput="checkStrategy()">
                <button class="adjust-btn" onclick="adjustValue('spot-price', 1)">+</button>
            </div>
        </div>
        <div class="field">
            <label>✍️ Target Strike ($)</label>
            <div class="control-wrapper">
                <button class="adjust-btn" onclick="adjustValue('target-strike', -1)">-</button>
                <input type="number" id="target-strike" value="4355.61" step="0.01" oninput="checkStrategy()">
                <button class="adjust-btn" onclick="adjustValue('target-strike', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <div class="field">
            <label>Live Kalshi Price (¢)</label>
            <div class="control-wrapper">
                <button class="adjust-btn" onclick="adjustValue('contract-price', -1)">-</button>
                <input type="number" id="contract-price" value="97" step="1" oninput="checkStrategy()">
                <button class="adjust-btn" onclick="adjustValue('contract-price', 1)">+</button>
            </div>
        </div>
        <div class="field">
            <label>Locked Trigger Floor</label>
            <input type="text" id="threshold" value="86%" readonly style="color: var(--text-muted); background: rgba(255,255,255,0.02); text-align: center; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 6px; font-weight: 600;">
        </div>
    </div>

    <div class="input-group" style="grid-template-columns: 1fr;">
        <div class="field">
            <label>⏱️ Auto-Calculated Time Left</label>
            <input type="text" id="time-left" value="Syncing Time..." style="font-size: 20px; text-align: center; border: 1px solid #ffd700; border-radius: 12px; background-color: var(--bg-color);" readonly>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;

    function playAlert() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }

    function adjustValue(inputId, change) {
        const input = document.getElementById(inputId);
        let val = parseFloat(input.value) || 0;
        val += change;
        input.value = (inputId === 'contract-price') ? val.toFixed(0) : val.toFixed(2);
        checkStrategy();
    }

    function updateAutomatedClock() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        
        const nextQuarterHour = Math.ceil((minutes + 0.01) / 15) * 15;
        let diffMinutes = nextQuarterHour - minutes - 1;
        let diffSeconds = 60 - seconds;
        
        if (diffSeconds === 60) {
            diffSeconds = 0;
            diffMinutes++;
        }
        
        const displayTime = `${diffMinutes.toString().padStart(2, '0')}:${diffSeconds.toString().padStart(2, '0')}`;
        document.getElementById('time-left').value = displayTime;
        return (diffMinutes * 60) + diffSeconds;
    }

    function checkStrategy() {
        const totalSecondsLeft = updateAutomatedClock();
        const spot = parseFloat(document.getElementById('spot-price').value) || 0;
        const strike = parseFloat(document.getElementById('target-strike').value) || 0;
        const premium = parseFloat(document.getElementById('contract-price').value) || 0;
        const trigger = 86; 

        const display = document.getElementById('signal-display');

        if (totalSecondsLeft <= 300 && premium >= trigger) {
            if (spot < strike) {
                display.innerText = "🚨 HIGH CONVICTION BUY DOWN";
                display.className = "signal-btn signal-buydown";
            } else {
                display.innerText = "🚨 HIGH CONVICTION BUY UP";
                display.className = "signal-btn signal-buyup";
            }
            playAlert();
        } else {
            display.innerText = "WAITING FOR WINDOW";
            display.className = "signal-btn";
        }
    }

    document.body.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    });

    setInterval(() => {
        updateAutomatedClock();
        checkStrategy();
    }, 1000);

    updateAutomatedClock();
    checkStrategy();
</script>

</body>
</html>
